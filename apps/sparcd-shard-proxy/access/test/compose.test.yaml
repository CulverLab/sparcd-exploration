# MinIO as the upstream for the access-proxy integration run. Loopback only,
# on a host port Docker picks, so a run never collides with a dev stack.
# The image is pgsty/minio, a community fork: MinIO stopped publishing images.

name: sparcd-access-test

services:
  minio:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data
    environment:
      MINIO_ROOT_USER: accesstestkey
      MINIO_ROOT_PASSWORD: accesstestsecret
    ports:
      - "127.0.0.1::9000"
    # `up --wait` needs a healthcheck to have anything to wait for. `mc` ships
    # in the server image, and `mc ready` is the check MinIO documents.
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 3s
