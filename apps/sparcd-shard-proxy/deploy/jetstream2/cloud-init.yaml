#cloud-config
# sparcd-shard-proxy on a Jetstream2 instance: Caddy fronting the JS2 object
# store (Ceph RGW) on port 443 plus the shard ports 8443-8453, HTTP/3 on every
# one. The uploader asks about ports up to 8462 and stripes across whatever
# answers, so this list is what sets the shard count: 11 shards, because twelve
# origins fill a volunteer's link on every path measured (see the app README).
#
# The Caddyfile below is a verbatim copy of the canonical
# apps/sparcd-shard-proxy/Caddyfile — cloud-init has no way to reference a file
# it is not carrying. Keep the two identical; see this directory's README for
# the one-line diff that checks it. Deployment-specific values arrive through
# /etc/caddy/sparcd.env, exactly as they do in compose.yaml.
#
# TLS certificates live on an attached volume mounted at /var/lib/caddy, so
# `openstack server rebuild` — the reliable reconfigure path from a CGNAT'd
# network, see README — reuses them instead of burning Let's Encrypt's
# 5-per-name-per-week budget. BBR is enabled: it holds per-connection
# throughput on long lossy paths far better than cubic.
write_files:
  - path: /etc/sysctl.d/90-bbr.conf
    permissions: '0644'
    content: |
      net.core.default_qdisc = fq
      net.ipv4.tcp_congestion_control = bbr

  - path: /etc/caddy/sparcd.env
    permissions: '0644'
    content: |
      UPSTREAM=https://js2.jetstream-cloud.org:8001
      PROXY_DOMAIN=sparcd-quic-proxy-03.bio260073.projects.jetstream-cloud.org
      SHARD_ADDRESSES=sparcd-quic-proxy-03.bio260073.projects.jetstream-cloud.org:8443, sparcd-quic-proxy-03.bio260073.projects.jetstream-cloud.org:8444, sparcd-quic-proxy-03.bio260073.projects.jetstream-cloud.org:8445, sparcd-quic-proxy-03.bio260073.projects.jetstream-cloud.org:8446, sparcd-quic-proxy-03.bio260073.projects.jetstream-cloud.org:8447, sparcd-quic-proxy-03.bio260073.projects.jetstream-cloud.org:8448, sparcd-quic-proxy-03.bio260073.projects.jetstream-cloud.org:8449, sparcd-quic-proxy-03.bio260073.projects.jetstream-cloud.org:8450, sparcd-quic-proxy-03.bio260073.projects.jetstream-cloud.org:8451, sparcd-quic-proxy-03.bio260073.projects.jetstream-cloud.org:8452, sparcd-quic-proxy-03.bio260073.projects.jetstream-cloud.org:8453

  # The packaged caddy.service reads no environment file of its own.
  - path: /etc/systemd/system/caddy.service.d/10-sparcd.conf
    permissions: '0644'
    content: |
      [Service]
      EnvironmentFile=/etc/caddy/sparcd.env

  - path: /etc/caddy/Caddyfile.sparcd
    permissions: '0644'
    content: |
      # The canonical shard-proxy config. One file serves local dev, any VM, and the
      # Jetstream2 deploy; everything site-specific arrives in the environment.
      #
      #   UPSTREAM         scheme://host:port of the S3 endpoint being fronted
      #                    e.g. https://js2.jetstream-cloud.org:8001
      #   PROXY_DOMAIN     hostname clients reach this proxy on — the :443 origin
      #   SHARD_ADDRESSES  the extra origins, comma-separated
      #                    e.g. "proxy.example.org:8443, proxy.example.org:8444"
      #
      # Caddy substitutes {$VAR} textually before parsing, so SHARD_ADDRESSES may
      # hold as many addresses as the deployment publishes ports for, and the shards
      # may be subdomains on :443 instead of ports (see README).
      #
      # HTTPS and HTTP/3 are automatic: Caddy issues public certificates via ACME for
      # real hostnames and internal ones for `localhost`, and advertises h3 on every
      # TLS listener. h3 only reaches clients if the deployment publishes each shard
      # port over UDP as well as TCP.

      (s3shard) {
      	# The upstream recomputes the SigV4 signature from the request it receives,
      	# and Host is one of the signed headers, so the client's Host must arrive
      	# byte-identical. Browsers omit the port when it is the scheme default, so
      	# the :443 site passes {host} (portless) and the shard sites pass
      	# {http.request.hostport} (host:port). Caddy preserves Host by default;
      	# pinning it here keeps the widely cargo-culted
      	# `header_up Host {upstream_hostport}` — which silently breaks every
      	# signature — from creeping in.
      	@preflight method OPTIONS
      	handle @preflight {
      		# The proxy owns CORS. Ceph RGW answers CORS per bucket only, so
      		# service-level calls (ListBuckets, the uploader's collection
      		# discovery) are browser-dead without this.
      		#
      		# Every Origin is reflected, because the tools this fronts are static
      		# bring-your-own-credential pages served from wherever an operator puts
      		# them. SigV4 is the authentication boundary, not CORS — see the
      		# README's security note. To also pin the browser origin, replace both
      		# Access-Control-Allow-Origin lines in this snippet with a literal:
      		#
      		#   header Access-Control-Allow-Origin "https://culverlab.github.io"
      		#
      		# and drop the `Vary "Origin"` lines, which only matter while the
      		# answer varies.
      		header Access-Control-Allow-Origin "{http.request.header.Origin}"
      		header Access-Control-Allow-Methods "GET, HEAD, PUT, POST, DELETE"
      		header Access-Control-Allow-Headers "authorization, content-type, if-match, if-none-match, range, amz-sdk-invocation-id, amz-sdk-request, x-amz-content-sha256, x-amz-date, x-amz-meta-sha256, x-amz-user-agent, x-amz-checksum-crc32, x-amz-checksum-sha256, x-amz-checksum-mode, x-amz-sdk-checksum-algorithm, x-amz-security-token, x-amz-decoded-content-length, x-amz-trailer"
      		header Access-Control-Max-Age "600"
      		header Vary "Origin"
      		respond "" 204
      	}
      	log
      	handle {
      		header {
      			Access-Control-Allow-Origin "{http.request.header.Origin}"
      			Access-Control-Expose-Headers "ETag, Content-Length, x-amz-meta-sha256, x-amz-request-id, x-amz-version-id"
      			Vary "Origin"
      		}
      		reverse_proxy {$UPSTREAM} {
      			header_up Host {args[0]}

      			# HTTP/3 requests carry no Content-Length. Unbuffered, Caddy
      			# forwards them to the HTTP/1.1 upstream as
      			# `Transfer-Encoding: chunked`, which RGW rejects with
      			# 501 NotImplemented. Buffering lets Caddy set a real length.
      			request_buffers 16KiB

      			# RGW emits its own per-bucket CORS headers. Dropping them here is
      			# what keeps the browser from seeing two Access-Control-Allow-Origin
      			# values and failing the check.
      			header_down -Access-Control-Allow-Origin
      			header_down -Access-Control-Allow-Methods
      			header_down -Access-Control-Allow-Headers
      			header_down -Access-Control-Expose-Headers
      			header_down -Access-Control-Max-Age
      		}
      	}
      }

      {$PROXY_DOMAIN}:443 {
      	import s3shard {host}
      }

      {$SHARD_ADDRESSES} {
      	import s3shard {http.request.hostport}
      }
runcmd:
  - sysctl --system
  # The cert volume has to exist before Caddy does. On a rebuild it is already
  # labelled and nothing is formatted. On a first boot every candidate is
  # inspected and exactly one must carry no signature at all; zero or
  # several and the boot fails loudly rather than guessing. This runs
  # unattended against whatever OpenStack attached, so guessing destroys data.
  # Set CERT_DEV to a /dev/disk/by-id/virtio-<volume-id-prefix> path to skip
  # the scan entirely — see README.
  - |
    set -e
    if ! blkid -L caddydata >/dev/null 2>&1; then
      BLANK=""
      for DEV in ${CERT_DEV:-/dev/vdb /dev/sdb}; do
        [ -b "$DEV" ] || continue
        # Any signature at all disqualifies it, not just a filesystem: a disk
        # whose data lives in partitions has no TYPE of its own, so asking for
        # one would call a full GPT disk blank and format it. Bare `blkid`
        # exits 0 for a partition table too, and 2 for a genuinely empty device.
        if INFO=$(blkid "$DEV" 2>/dev/null); then
          echo "skipping $DEV: holds ${INFO#*: }" >&2
        else
          BLANK="$BLANK $DEV"
        fi
      done
      set -- $BLANK
      [ $# -eq 1 ] || { echo "need exactly one blank cert volume, found $#:$BLANK" >&2; exit 1; }
      mkfs.ext4 -L caddydata "$1"
    fi
    mkdir -p /var/lib/caddy
    grep -q caddydata /etc/fstab || echo 'LABEL=caddydata /var/lib/caddy ext4 defaults 0 2' >> /etc/fstab
    mount -a
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y caddy
  - mv /etc/caddy/Caddyfile.sparcd /etc/caddy/Caddyfile
  - chown -R caddy:caddy /var/lib/caddy
  - systemctl daemon-reload
  - systemctl restart caddy
