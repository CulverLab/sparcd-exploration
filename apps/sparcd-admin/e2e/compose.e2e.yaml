# MinIO as the upstream for the admin end-to-end run. Loopback only, on a host
# port Docker picks, and under its own project name so it never collides with
# the access-proxy integration stack or a dev stack.
# The image is pgsty/minio, a community fork: MinIO stopped publishing images.

name: sparcd-admin-e2e

services:
  minio:
    image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data
    environment:
      MINIO_ROOT_USER: admine2ekey
      MINIO_ROOT_PASSWORD: admine2esecret
    ports:
      - "127.0.0.1::9000"
