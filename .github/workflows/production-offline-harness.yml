name: Production offline harness

on:
  pull_request:
    paths:
      - "apps/sparcd-uploader/**"
      - "apps/sparcd-tagger/**"
      - "packages/**"
      - "scripts/build-offline.mjs"
      - "scripts/offline/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/production-offline-harness.yml"
  push:
    branches: [main]
    paths:
      - "apps/sparcd-uploader/**"
      - "apps/sparcd-tagger/**"
      - "packages/**"
      - "scripts/build-offline.mjs"
      - "scripts/offline/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/production-offline-harness.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Google Chrome
        run: pnpm --filter sparcd-uploader exec playwright install --with-deps chrome

      - name: Check production server routing
        run: pnpm --filter sparcd-uploader test:production:server

      - name: Build both apps and run production Chrome coverage
        run: pnpm --filter sparcd-uploader test:production:offline

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-offline-results
          path: apps/sparcd-uploader/test-results/production/
          if-no-files-found: ignore
