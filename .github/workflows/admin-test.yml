name: Admin test
on:
  pull_request:
    paths:
      - "apps/sparcd-admin/**"
      # The end-to-end run drives the access proxy, the Uploader and the Tagger too.
      - "apps/sparcd-shard-proxy/**"
      - "apps/sparcd-uploader/**"
      - "apps/sparcd-tagger/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/admin-test.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter sparcd-admin check && pnpm --filter sparcd-admin test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter sparcd-admin exec playwright install --with-deps chromium
      # Starts its own loopback MinIO (Docker ships on ubuntu-latest), the
      # access proxy, and built Admin, Uploader and Tagger apps.
      - run: pnpm --filter sparcd-admin e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-results
          path: |
            apps/sparcd-admin/e2e/.results/
            apps/sparcd-admin/e2e/shots/
          include-hidden-files: true
