name: Explorer WASM
on:
  pull_request:
    paths: ["apps/sparcd-explorer/**", ".github/workflows/explorer-wasm.yml"]
jobs:
  remembered-connection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: uv sync --locked
        working-directory: apps/sparcd-explorer
      - name: Generate the Pages WASM notebook
        working-directory: apps/sparcd-explorer
        run: |
          set -euo pipefail
          {
            printf '# /// script\n# requires-python = ">=3.11"\n# dependencies = ["marimo","minio","python-dotenv","polars","plotly","anywidget"]\n# ///\n\n'
            cat notebooks/hello.py
          } > notebooks/hello_wasm.py
      - run: uv run marimo export html-wasm notebooks/hello_wasm.py -o dist --mode run --force
        working-directory: apps/sparcd-explorer
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sparcd/sparcd-explorer exec playwright install --with-deps chromium
      - run: pnpm --filter @sparcd/sparcd-explorer exec node tests/remember_connection_wasm.mjs dist
